#:schema ./contracts.schema.json

[[contracts]]
title = "Caller domains own identity facts"
statement = """
Caller domains own the identity schema, schema version, and complete identity \
payload. dr-serialize validates the document shape and Strict JSON Value \
constraints, and never selects, adds, omits, or defaults identity facts."""
rationale = """
Only the owning domain can decide which facts define sameness; keeping that \
decision outside dr-serialize prevents serialization policy from silently \
redefining identity."""
date = "2026-08-04"
check = "uv run pytest -q tests/identity"
terms = ["identity", "identity payload", "identity document"]

[[contracts]]
title = "Identity hashing never normalizes or coerces"
statement = """
Identity hashing consumes the mapping returned by its document argument as a \
Strict JSON Value. It never uses Serializer, consumer handlers, truncation, or \
coercion, and a Diagnostic Normalized JSON Value is never identity input. The \
supported argument type is IdentityDocument; the runtime path relies on its \
to_json_dict() protocol rather than enforcing that concrete type."""
rationale = """
Keeping policy-driven or lossy conversion out of the identity path ensures \
that normalization choices cannot redefine caller-owned identity facts."""
date = "2026-08-04"
check = "uv run pytest -q tests/identity/test_document.py::test_identity_path_does_not_coerce_via_diagnostic_normalization"
terms = [
  "identity",
  "strict JSON value",
  "diagnostic normalized JSON value",
  "identity hash",
]

[[contracts]]
title = "Identity Documents apply the deep-copy protocol at their boundary"
statement = """
IdentityDocument construction and payload access apply copy.deepcopy. Both the \
caller-provided payload and the copied construction value are validated before \
that value is stored. Accepted custom list and dict subclasses control whether \
their deep-copy protocol yields alias isolation."""
rationale = """
The explicit copy-in and copy-out protocol isolates ordinary built-in \
containers while keeping the actual guarantee truthful for accepted custom \
container subclasses."""
date = "2026-08-04"
check = "uv run pytest -q tests/identity/test_document.py -k 'mutat or alias or copy'"
terms = ["identity document", "canonical identity JSON text", "identity hash"]

[[contracts]]
title = "Canonical JSON Text follows frozen profile v1"
statement = """
canonical_json(), canonical_json_bytes(), json_hash(), and the identity \
functions validate Strict JSON Values at runtime. Profile v1 sorts object \
keys, preserves list order, uses compact separators and ASCII escaping, \
rejects non-finite numbers and cycles, admits at most 100 nested containers \
and 640 decimal digits per integer, and encodes text as UTF-8 through the \
standard-library JSON encoder. Scalars have container depth 0; a root list or \
object has depth 1; each nested list or object adds 1. Identity Document \
construction validates the complete prospective document against the same \
bounds. The profile rules and golden cases are frozen; it is project-owned \
rather than RFC 8785, and an incompatible future profile uses a separately \
named API."""
rationale = """
A frozen, explicitly project-owned profile keeps canonical bytes and their \
hashes reproducible without implying conformance to a different standard."""
date = "2026-08-04"
check = "uv run pytest -q tests/canonical tests/identity"
terms = [
  "strict JSON value",
  "canonical JSON text",
  "canonical identity JSON text",
]

[[contracts]]
title = "Full hashes are nominal and prefixes are display-only"
statement = """
Full SHA-256 results are Sha256Digest values containing exactly 64 lowercase \
hexadecimal characters. Truncated json_hash() results and \
identity_hash_prefix() results are plain display strings and never establish \
identity, equality, storage keys, or references."""
rationale = """
The nominal full-digest type makes complete hashes distinguishable from \
collision-prone display projections at API boundaries."""
date = "2026-08-04"
check = "uv run pytest -q tests/_core/test_digests.py tests/canonical tests/identity -k 'hash or digest or prefix'"
terms = ["hash", "identity hash", "identity hash prefix"]

[[contracts]]
title = "Normalization policy is instance-scoped and library-guarded"
statement = """
The supported Serializer configuration supplies a validated \
SerializationLimits instance and an ordered tuple of handlers; there is no \
global registry or implicit policy. Serializer uses those objects without \
copying or runtime type enforcement, so callers must not mutate aliased \
configuration. max_depth, max_bytes, and hard_max_bytes are non-negative when \
present, zero is valid, and max_bytes cannot exceed hard_max_bytes when the \
latter is present. The library owns path and depth bookkeeping, validates \
consumer-handled results as normalization Jsonable under the depth limit, and \
enforces encoded size on the final result."""
rationale = """
Instance-scoped policy keeps conversion choices explicit, while library-owned \
validation and bookkeeping apply the declared limits consistently across \
built-in and consumer handling."""
date = "2026-08-04"
check = "uv run pytest -q tests/normalization"
terms = [
  "normalization",
  "diagnostic normalized JSON value",
  "serialization limits",
]

[[contracts]]
title = "Strict JSON decoding is bounded and bytes-first"
statement = """
decode_strict_json_bytes() accepts exactly one complete UTF-8 Strict JSON Value \
under explicit non-negative byte and depth limits. It checks the byte bound \
before decoding, enforces structural depth iteratively, and rejects a BOM, \
invalid UTF-8, duplicate decoded keys, non-finite numbers, malformed syntax, \
trailing content, and multiple root values without coercion."""
rationale = """
Checking bytes first and parsing iteratively bounds work before text or nested \
structure is trusted, while strict rejection preserves the decoded value's \
declared JSON meaning."""
date = "2026-08-04"
check = "uv run pytest -q tests/decoding/test_decoder.py"
terms = ["strict JSON value"]

[[contracts]]
title = "Diagnostic disclosure depends on the entry point"
statement = """
Strict decoder messages, diagnostics, and exception cause and context contain \
only bounded structural metadata and never echo or retain input. Traceback \
locals are outside this guarantee. Other \
SerializationError diagnostics are structurally persistable, and their \
preview and detail fields are bounded, but they may contain payload-derived \
details, previews, or underlying reprs and are not secret-safe. Diagnostic \
value and path rendering cannot replace a typed serialization error even when \
caller-defined repr implementations fail."""
rationale = """
The strict byte decoder is an untrusted-input boundary whose persistable error \
surfaces exclude input, while other serialization failures preserve debugging \
evidence whose disclosure depends on the calling context."""
date = "2026-08-04"
check = "uv run pytest -q tests/decoding tests/normalization"

[[contracts]]
title = "Canonical value ordering is policy-free and duplicate-preserving"
statement = """
canonical_sorted_values() orders already-JSON-safe values by their Canonical \
JSON Text profile v1 representation. It never normalizes, coerces, \
deduplicates, or selects domain fields; duplicates are preserved. Values \
outside strict Jsonable fail through JsonEncodeError with the failing \
member's input index prefixed onto the error path; there is no parallel \
error taxonomy. The function projects logically unordered collections into \
deterministic JSON arrays and is never used to reorder semantically ordered \
arrays."""
rationale = """
A single policy-free ordering primitive lets any producer of unordered \
collections -- including downstream Pydantic field serializers -- reach \
deterministic JSON without dr-serialize taking on normalization policy or a \
second error taxonomy."""
date = "2026-08-05"
check = "uv run pytest -q tests/canonical/test_value_ordering.py"
terms = ["canonical value ordering", "canonicalization", "strict JSON value"]

[[contracts]]
title = "Direct unordered-set normalization is deterministic"
statement = """
Set and frozenset values that reach Serializer's built-in unordered-set \
handler are converted recursively and ordered with canonical_sorted_values(), \
so that handler's output is byte-identical across fresh processes regardless \
of PYTHONHASHSEED. Model or consumer conversions to lists erase unordered \
provenance and must apply canonical_sorted_values() at that boundary. Lists \
and tuples retain their original order. Non-finite numbers inside directly \
handled sets are rejected through canonical JSON error behavior even though \
normalization passes them through elsewhere."""
rationale = """
Canonical ordering removes hash-iteration variance while unordered provenance \
is still available. Once another conversion produces a list, canonical_json() \
preserves that list order and cannot recover or repair the lost provenance."""
date = "2026-08-05"
check = "uv run pytest -q tests/normalization/test_set_normalization.py tests/normalization/test_hash_seed_determinism.py"
terms = ["normalization", "canonical value ordering"]

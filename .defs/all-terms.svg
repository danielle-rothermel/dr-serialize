<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="840" viewBox="0 0 1480 840" role="img" aria-labelledby="title desc" data-defs-reference="terms.toml" data-prototype-kind="category-membership-composition-type-hierarchy-graph" data-reference-completeness="selected">
  <metadata id="defs-reference">{"terms":["normalization","canonicalization","identity","document","payload","hash","strict JSON value","canonical JSON text","identity payload","identity document","canonical identity JSON text","identity hash","identity hash prefix","diagnostic normalized JSON value","serialization limits"],"categories":["normalization","canonicalization","identity"],"memberships":[{"term":"normalization","category":"normalization"},{"term":"canonicalization","category":"canonicalization"},{"term":"identity","category":"identity"},{"term":"document","category":"identity"},{"term":"hash","category":"canonicalization"},{"term":"hash","category":"identity"},{"term":"strict JSON value","category":"identity"},{"term":"canonical JSON text","category":"canonicalization"},{"term":"canonical identity JSON text","category":"identity"},{"term":"diagnostic normalized JSON value","category":"normalization"},{"term":"serialization limits","category":"normalization"}],"edges":[{"kind":"part_of","from":"payload","to":"document"},{"kind":"part_of","from":"identity payload","to":"identity document"},{"kind":"is_a","from":"identity document","to":"document"},{"kind":"is_a","from":"canonical identity JSON text","to":"canonical JSON text"},{"kind":"is_a","from":"identity hash","to":"hash"},{"kind":"part_of","from":"identity hash prefix","to":"identity hash"}]}</metadata>
  <title id="title">Composition, Type Hierarchy, and Category Routing</title>
  <desc id="desc">A selected compact graph of fifteen vocabulary terms and eleven displayed category memberships, combining three name-only composition cards with three neutral dashed type-hierarchy arrows from general types to specializations. Eight colored category routes and three category-hub self-membership markers are shown.</desc>
  <defs>
    <filter id="surface-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#243248" flood-opacity="0.08"/>
    </filter>
    <filter id="card-shadow" x="-15%" y="-25%" width="130%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#243248" flood-opacity="0.10"/>
    </filter>
    <filter id="composition-shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#38225f" flood-opacity="0.12"/>
    </filter>
    <filter id="composition-child-shadow" x="-15%" y="-25%" width="130%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4d2d80" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="surface-wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfcfe"/>
    </linearGradient>
    <linearGradient id="composition-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbf9fe"/>
    </linearGradient>
    <linearGradient id="composition-child-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7fe"/>
      <stop offset="1" stop-color="#f1eafa"/>
    </linearGradient>
    <radialGradient id="normalization-wash">
      <stop offset="0" stop-color="#e8f2ff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#e8f2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="canonicalization-wash">
      <stop offset="0" stop-color="#fff4d6" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#fff4d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="identity-wash">
      <stop offset="0" stop-color="#f0eaff" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#f0eaff" stop-opacity="0"/>
    </radialGradient>
    <marker id="is-a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#657184"/>
    </marker>
  </defs>
  <style>
    .system { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { fill: #1b2333; font-size: 30px; font-weight: 760; letter-spacing: -0.45px; }
    .subtitle { fill: #697487; font-size: 14px; font-weight: 500; }
    .connector { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0.58; }
    .connector-normalization { stroke: #145a9d; }
    .connector-canonicalization { stroke: #8a5a00; }
    .connector-identity { stroke: #6442a3; }
    .is-a-route { fill: none; stroke: #657184; stroke-width: 2.5; stroke-dasharray: 8 8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#is-a-arrow); opacity: 0.94; }
    .term-card { fill: #ffffff; stroke: #d9e0e9; stroke-width: 1.25; }
    .term-label { fill: #263246; font-size: 16px; font-weight: 675; letter-spacing: -0.1px; }
    .term-node:focus, .composition-node:focus, .composition-child:focus { outline: none; }
    .term-node:focus .term-card { stroke: #1866b4; stroke-width: 3; }
    .composition-shell { fill: url(#composition-surface); stroke: #6f42c1; stroke-width: 2.5; }
    .composition-divider { stroke: #e2d9ed; stroke-width: 1.75; }
    .composition-child-card { fill: url(#composition-child-surface); stroke: #8a5ec8; stroke-width: 2; }
    .composition-label { fill: #2d1d46; font-size: 20px; font-weight: 690; letter-spacing: -0.2px; }
    .composition-child-label { fill: #2d1d46; font-size: 18px; font-weight: 675; letter-spacing: -0.15px; }
    .composition-node:focus > .composition-shell { stroke: #1866b4; stroke-width: 3.5; }
    .composition-child:focus .composition-child-card { stroke: #1866b4; stroke-width: 3; }
    .hub-node:focus { outline: none; }
    .hub-node:focus .hub-shell { stroke-width: 3; }
    .hub-label { font-size: 18px; font-weight: 720; letter-spacing: 0.1px; }
    .hub-normalization .hub-shell { fill: #e8f2ff; stroke: #79afe3; }
    .hub-normalization .hub-core { fill: #145a9d; }
    .hub-normalization .hub-label { fill: #145a9d; }
    .hub-canonicalization .hub-shell { fill: #fff4d6; stroke: #deb34d; }
    .hub-canonicalization .hub-core { fill: #8a5a00; }
    .hub-canonicalization .hub-label { fill: #8a5a00; }
    .hub-identity .hub-shell { fill: #f0eaff; stroke: #ac93e4; }
    .hub-identity .hub-core { fill: #6442a3; }
    .hub-identity .hub-label { fill: #6442a3; }
    .hub-shell { stroke-width: 1.5; }
  </style>

  <rect width="1480" height="840" fill="#f1f4f8"/>
  <rect x="16" y="8" width="1448" height="816" rx="22" fill="url(#surface-wash)" stroke="#d8dfe8" filter="url(#surface-shadow)"/>
  <text x="52" y="84" class="system title">Composition, Type Hierarchy, and Category Routing</text>
  <text x="52" y="111" class="system subtitle">15 terms · 11 displayed memberships · 8 category routes · aligned dashed arrows show general → specialized type</text>
  <line x1="52" y1="136" x2="1428" y2="136" stroke="#e2e7ee"/>

  <ellipse cx="220" cy="610" rx="215" ry="190" fill="url(#normalization-wash)"/>
  <ellipse cx="555" cy="360" rx="535" ry="245" fill="url(#canonicalization-wash)"/>
  <ellipse cx="1040" cy="510" rx="405" ry="300" fill="url(#identity-wash)"/>

  <!-- Membership and hierarchy routes stay behind nodes; metadata declares exactly this visible projection. -->
  <g id="edge-layer" aria-hidden="true">
    <g id="visible-membership-connectors">
      <path d="M 220 506 C 220 522 220 536 220 550" class="connector connector-normalization" data-term="serialization limits" data-category="normalization"/>
      <path d="M 220 622 C 220 640 220 655 220 670" class="connector connector-normalization" data-term="diagnostic normalized JSON value" data-category="normalization"/>
      <path d="M 420 236 C 480 236 540 236 600 236" class="connector connector-canonicalization" data-term="canonical JSON text" data-category="canonicalization"/>
      <path d="M 330 272 C 330 390 470 520 640 548" class="connector connector-canonicalization" data-term="hash" data-category="canonicalization"/>
      <path d="M 790 548 C 845 548 850 454 915 414 C 962 385 1014 380 1065 377" class="connector connector-identity" data-term="hash" data-category="identity"/>
      <path d="M 880 333 C 930 333 977 333 1025 333" class="connector connector-identity" data-term="canonical identity JSON text" data-category="identity"/>
      <path d="M 1210 305 C 1221 286 1238 269 1264 256" class="connector connector-identity" data-term="strict JSON value" data-category="identity"/>
      <path d="M 1145 377 L 1145 420" class="connector connector-identity" data-term="document" data-category="identity"/>
    </g>
    <g id="visible-type-hierarchy-routes">
      <path d="M 725 256 L 725 305" class="is-a-route" data-relation="is_a" data-from="canonical identity JSON text" data-to="canonical JSON text"/>
      <path d="M 715 576 L 715 620" class="is-a-route" data-relation="is_a" data-from="identity hash" data-to="hash"/>
      <path d="M 1145 570 L 1145 620" class="is-a-route" data-relation="is_a" data-from="identity document" data-to="document"/>
    </g>
  </g>

  <!-- Name-only composition cards keep structural parts nested while category and type routes attach to outer cards. -->
  <g class="composition-node" data-map-term="identity hash" tabindex="0" role="group" aria-labelledby="label-identity-hash">
    <rect x="540" y="620" width="350" height="150" rx="22" class="composition-shell" filter="url(#composition-shadow)"/>
    <text id="label-identity-hash" x="568" y="656" class="system composition-label">Identity Hash</text>
    <line x1="568" y1="672" x2="862" y2="672" class="composition-divider"/>
    <g class="composition-child" data-map-term="identity hash prefix" data-relation="part_of" data-from="identity hash prefix" data-to="identity hash" tabindex="0" role="group" aria-labelledby="label-identity-hash-prefix">
      <rect x="568" y="690" width="270" height="50" rx="14" class="composition-child-card" filter="url(#composition-child-shadow)"/>
      <text id="label-identity-hash-prefix" x="590" y="722" class="system composition-child-label">Identity Hash Prefix</text>
    </g>
  </g>

  <g class="composition-node" data-map-term="document" tabindex="0" role="group" aria-labelledby="label-document">
    <rect x="930" y="420" width="430" height="150" rx="22" class="composition-shell" filter="url(#composition-shadow)"/>
    <text id="label-document" x="958" y="456" class="system composition-label">Document</text>
    <line x1="958" y1="472" x2="1332" y2="472" class="composition-divider"/>
    <g class="composition-child" data-map-term="payload" data-relation="part_of" data-from="payload" data-to="document" tabindex="0" role="group" aria-labelledby="label-payload">
      <rect x="958" y="490" width="240" height="50" rx="14" class="composition-child-card" filter="url(#composition-child-shadow)"/>
      <text id="label-payload" x="980" y="522" class="system composition-child-label">Payload</text>
    </g>
  </g>

  <g class="composition-node" data-map-term="identity document" tabindex="0" role="group" aria-labelledby="label-identity-document">
    <rect x="930" y="620" width="430" height="150" rx="22" class="composition-shell" filter="url(#composition-shadow)"/>
    <text id="label-identity-document" x="958" y="656" class="system composition-label">Identity Document</text>
    <line x1="958" y1="672" x2="1332" y2="672" class="composition-divider"/>
    <g class="composition-child" data-map-term="identity payload" data-relation="part_of" data-from="identity payload" data-to="identity document" tabindex="0" role="group" aria-labelledby="label-identity-payload">
      <rect x="958" y="690" width="280" height="50" rx="14" class="composition-child-card" filter="url(#composition-child-shadow)"/>
      <text id="label-identity-payload" x="980" y="722" class="system composition-child-label">Identity Payload</text>
    </g>
  </g>

  <!-- Each category term doubles as its category hub and self-membership marker. -->
  <g class="hub-node hub-normalization" data-map-term="normalization" data-term="normalization" data-category="normalization" tabindex="0" role="group" aria-labelledby="label-normalization">
    <title>The policy-driven transformation of arbitrary values into a bounded, JSON-safe representation for diagnostics or non-identity storage. Normalization may be lossy, and its conversion choices are deliberately separate from identity.</title>
    <rect x="70" y="550" width="300" height="72" rx="36" class="hub-shell"/>
    <circle cx="110" cy="586" r="10" class="hub-core"/>
    <text id="label-normalization" x="133" y="593" class="system hub-label">Normalization</text>
  </g>
  <g class="hub-node hub-canonicalization" data-map-term="canonicalization" data-term="canonicalization" data-category="canonicalization" tabindex="0" role="group" aria-labelledby="label-canonicalization">
    <title>The transformation of an accepted JSON value into the one JSON representation selected by a declared deterministic profile. It preserves the accepted value while eliminating incidental variation in formatting and object-key order.</title>
    <rect x="70" y="200" width="350" height="72" rx="36" class="hub-shell"/>
    <circle cx="112" cy="236" r="10" class="hub-core"/>
    <text id="label-canonicalization" x="135" y="243" class="system hub-label">Canonicalization</text>
  </g>
  <g class="hub-node hub-identity" data-map-term="identity" data-term="identity" data-category="identity" tabindex="0" role="group" aria-labelledby="label-identity">
    <title>The caller-defined set of domain facts that determines whether two objects are considered the same across processes and storage. Identity includes only deliberately selected domain facts and excludes incidental runtime or storage state.</title>
    <rect x="1025" y="305" width="240" height="72" rx="36" class="hub-shell"/>
    <circle cx="1065" cy="341" r="10" class="hub-core"/>
    <text id="label-identity" x="1088" y="348" class="system hub-label">Identity</text>
  </g>

  <g class="term-node" data-map-term="serialization limits" tabindex="0" role="group" aria-labelledby="label-serialization-limits">
    <title>Explicit bounds on nesting depth and encoded size that constrain normalization. They distinguish the selected operating limit from any absolute storage ceiling so a violation can report both accurately.</title>
    <rect x="80" y="450" width="280" height="56" rx="12" class="term-card" filter="url(#card-shadow)"/>
    <text id="label-serialization-limits" x="220" y="484" text-anchor="middle" class="system term-label">Serialization Limits</text>
  </g>
  <g class="term-node" data-map-term="diagnostic normalized JSON value" tabindex="0" role="group" aria-labelledby="label-diagnostic-normalized-json-value">
    <title>The potentially lossy, size- and depth-bounded JSON-safe value produced by normalization for diagnostics or non-identity storage. It is not an identity payload and never supplies input to identity hashing.</title>
    <rect x="55" y="670" width="330" height="56" rx="12" class="term-card" filter="url(#card-shadow)"/>
    <text id="label-diagnostic-normalized-json-value" x="220" y="704" text-anchor="middle" class="system term-label">Diagnostic Normalized JSON Value</text>
  </g>
  <g class="term-node" data-map-term="canonical JSON text" tabindex="0" role="group" aria-labelledby="label-canonical-json-text">
    <title>The single deterministic UTF-8 JSON text selected for a JSON value, using compact separators and sorted object keys. The same accepted value always produces the same text and bytes.</title>
    <rect x="600" y="200" width="250" height="56" rx="12" class="term-card" filter="url(#card-shadow)"/>
    <text id="label-canonical-json-text" x="725" y="234" text-anchor="middle" class="system term-label">Canonical JSON Text</text>
  </g>
  <g class="term-node" data-map-term="canonical identity JSON text" tabindex="0" role="group" aria-labelledby="label-canonical-identity-json-text">
    <title>The canonical JSON text of a validated identity document.</title>
    <rect x="570" y="305" width="310" height="56" rx="12" class="term-card" filter="url(#card-shadow)"/>
    <text id="label-canonical-identity-json-text" x="725" y="339" text-anchor="middle" class="system term-label">Canonical Identity JSON Text</text>
  </g>
  <g class="term-node" data-map-term="hash" tabindex="0" role="group" aria-labelledby="label-hash">
    <title>A deterministic fixed-length value computed by a declared algorithm over exact declared input bytes; its specific role and semantics come from the qualified term.</title>
    <rect x="640" y="520" width="150" height="56" rx="12" class="term-card" filter="url(#card-shadow)"/>
    <text id="label-hash" x="715" y="554" text-anchor="middle" class="system term-label">Hash</text>
  </g>
  <g class="term-node" data-map-term="strict JSON value" tabindex="0" role="group" aria-labelledby="label-strict-json-value">
    <title>A value drawn only from the JSON data model: null, booleans, strings, finite numbers, ordered arrays of strict JSON values, and string-keyed objects whose values are strict JSON values, recursively. It excludes non-finite numbers, reference cycles, unordered collections, and values that require conversion into JSON.</title>
    <rect x="1230" y="200" width="200" height="56" rx="12" class="term-card" filter="url(#card-shadow)"/>
    <text id="label-strict-json-value" x="1330" y="234" text-anchor="middle" class="system term-label">Strict JSON Value</text>
  </g>
</svg>

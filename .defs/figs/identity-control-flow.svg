<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">dr-serialize identity control flow</title>
  <desc id="desc">A left-to-right diagram showing raw-mapping and separate-parts entry points converging on exact identity-document shape validation and the IdentityDocument constructor, which owns recursive Strict JSON Value validation and external-alias isolation. A validated document becomes Canonical Identity JSON Text and its exact UTF-8 bytes, then a full Sha256Digest identity hash, with a separate display-only prefix. Supporting panels enumerate accepted and rejected Python shapes, JsonPath errors, caller-owned decisions, and prohibited normalization or coercion.</desc>

  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#1b2333" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1866b4"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b8a3e"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a6700"/>
    </marker>
    <style>
      .bg { fill: #f4f6f9; }
      .surface { fill: #ffffff; stroke: #e3e8ef; stroke-width: 1.5; }
      .ink { fill: #1b2333; }
      .muted { fill: #5b6577; }
      .blue { fill: #1866b4; }
      .purple { fill: #6f42c1; }
      .green { fill: #2b8a3e; }
      .amber { fill: #9a6700; }
      .red { fill: #c0392b; }
      .title { font: 700 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .dek { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .section { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.2px; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .strong { font-weight: 700; }
      .mono { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .mono-small { font: 500 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .arrow { fill: none; stroke: #1866b4; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .arrow-green { fill: none; stroke: #2b8a3e; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .arrow-amber { fill: none; stroke: #9a6700; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-amber); }
      .divider { stroke: #e3e8ef; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1100"/>

  <!-- Heading -->
  <text x="60" y="63" class="title ink">What is the identity control flow?</text>
  <text x="60" y="94" class="dek muted">Validate once, isolate the complete document, then hash exactly one canonical byte sequence.</text>
  <g transform="translate(1190 45)">
    <rect width="350" height="42" rx="21" fill="#e8f5ec" stroke="#2b8a3e"/>
    <circle cx="23" cy="21" r="6" fill="#2b8a3e"/>
    <text x="40" y="26" class="small green strong">STRICT · POLICY-FREE · DETERMINISTIC</text>
  </g>

  <!-- Caller-owned decisions -->
  <g filter="url(#shadow)">
    <rect x="60" y="125" width="1480" height="102" rx="14" fill="#f4eefb" stroke="#6f42c1" stroke-width="1.5"/>
  </g>
  <text x="84" y="154" class="label purple">CALLER OWNS THE MEANING</text>
  <text x="84" y="184" class="section ink">Choose the schema name, schema version, complete identity-bearing payload fields, and list ordering.</text>
  <text x="84" y="207" class="body muted">dr-serialize never selects, infers, drops, or rearranges domain fields; it validates the caller’s declared document.</text>
  <g transform="translate(1274 145)">
    <rect width="238" height="56" rx="9" fill="#ffffff" stroke="#d9c9ef"/>
    <text x="15" y="23" class="mono-small purple">{schema, schema_version,</text>
    <text x="15" y="42" class="mono-small purple"> payload}</text>
  </g>

  <!-- Entry points -->
  <text x="60" y="269" class="label muted">1 · PUBLIC ENTRY POINTS</text>
  <g filter="url(#shadow)">
    <rect x="60" y="286" width="320" height="141" rx="12" class="surface"/>
  </g>
  <rect x="60" y="286" width="7" height="141" rx="3.5" fill="#1866b4"/>
  <text x="84" y="316" class="section ink">Raw mapping</text>
  <text x="84" y="344" class="mono blue">validate_identity_document(</text>
  <text x="104" y="366" class="mono blue">document: dict[Any, Any]</text>
  <text x="84" y="388" class="mono blue">) -&gt; IdentityDocument</text>
  <text x="84" y="412" class="small muted">Untrusted outer envelope enters here.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="447" width="320" height="159" rx="12" class="surface"/>
  </g>
  <rect x="60" y="447" width="7" height="159" rx="3.5" fill="#1866b4"/>
  <text x="84" y="477" class="section ink">Separate parts</text>
  <text x="84" y="505" class="mono blue">build_identity_document(</text>
  <text x="104" y="527" class="mono blue">*, schema: str,</text>
  <text x="104" y="549" class="mono blue">schema_version: int,</text>
  <text x="104" y="571" class="mono blue">payload: Any</text>
  <text x="84" y="593" class="mono blue">) -&gt; IdentityDocument</text>

  <!-- Shape gate -->
  <path d="M380 356 H421" class="arrow"/>
  <path d="M380 527 H401 Q421 527 421 507 V432" class="arrow"/>
  <text x="418" y="269" class="label muted">2 · EXACT OUTER SHAPE</text>
  <g filter="url(#shadow)">
    <rect x="418" y="286" width="282" height="320" rx="12" fill="#e9f2fb" stroke="#1866b4" stroke-width="1.5"/>
  </g>
  <text x="442" y="320" class="section ink">One envelope, no extras</text>
  <text x="442" y="350" class="body ink strong">Raw mapping gate</text>
  <text x="442" y="374" class="mono-small ink">isinstance(document, dict)</text>
  <text x="442" y="398" class="mono-small ink">keys == {"schema",</text>
  <text x="442" y="418" class="mono-small ink"> "schema_version", "payload"}</text>
  <line x1="442" y1="439" x2="676" y2="439" class="divider"/>
  <text x="442" y="469" class="body ink strong">Parts adapter</text>
  <text x="442" y="493" class="small muted">Assembles that exact mapping, then</text>
  <text x="442" y="513" class="small muted">delegates to the same validator.</text>
  <g transform="translate(442 536)">
    <rect width="234" height="47" rx="8" fill="#fdeceb" stroke="#c0392b"/>
    <text x="13" y="20" class="small red strong">IdentityDocumentError</text>
    <text x="13" y="38" class="mono-small red">path=() · missing / extra</text>
  </g>

  <!-- Single invariant owner -->
  <path d="M700 446 H750" class="arrow"/>
  <text x="750" y="269" class="label purple">3 · SINGLE INVARIANT OWNER</text>
  <g filter="url(#shadow)">
    <rect x="750" y="286" width="430" height="320" rx="14" fill="#ffffff" stroke="#6f42c1" stroke-width="2.2"/>
  </g>
  <rect x="750" y="286" width="430" height="55" rx="14" fill="#f4eefb"/>
  <rect x="750" y="328" width="430" height="13" fill="#f4eefb"/>
  <text x="774" y="319" class="section purple">IdentityDocument constructor</text>
  <text x="774" y="371" class="mono ink">IdentityDocument(</text>
  <text x="794" y="393" class="mono ink">schema: str, schema_version: int,</text>
  <text x="794" y="415" class="mono ink">payload: Jsonable</text>
  <text x="774" y="437" class="mono ink">) -&gt; IdentityDocument</text>
  <text x="774" y="467" class="small purple strong">@dataclass(frozen=True, slots=True)</text>
  <line x1="774" y1="484" x2="1156" y2="484" class="divider"/>
  <circle cx="786" cy="510" r="10" fill="#f4eefb" stroke="#6f42c1"/>
  <text x="786" y="514" text-anchor="middle" class="small purple strong">1</text>
  <text x="806" y="515" class="small ink">schema is str; schema_version is int, never bool</text>
  <circle cx="786" cy="540" r="10" fill="#f4eefb" stroke="#6f42c1"/>
  <text x="786" y="544" text-anchor="middle" class="small purple strong">2</text>
  <text x="806" y="545" class="small ink">recursive Strict JSON Value walk starts at ("payload",)</text>
  <circle cx="786" cy="570" r="10" fill="#f4eefb" stroke="#6f42c1"/>
  <text x="786" y="574" text-anchor="middle" class="small purple strong">3</text>
  <text x="806" y="575" class="small ink">deep-copy only after validation → owned snapshot</text>
  <text x="965" y="596" text-anchor="middle" class="small purple strong">Direct construction cannot bypass these checks.</text>

  <!-- Canonical and full-hash outputs -->
  <path d="M1180 382 H1220" class="arrow-green"/>
  <text x="1380" y="269" text-anchor="middle" class="small muted strong" style="font-size:11px;letter-spacing:.4px">4 · CANONICAL IDENTITY JSON TEXT → HASH</text>
  <g filter="url(#shadow)">
    <rect x="1220" y="286" width="320" height="166" rx="12" fill="#e8f5ec" stroke="#2b8a3e" stroke-width="1.5"/>
  </g>
  <text x="1244" y="318" class="section ink">Canonical Identity JSON Text</text>
  <text x="1244" y="346" class="mono green">canonical_identity_json(</text>
  <text x="1264" y="368" class="mono green">document: IdentityDocument</text>
  <text x="1244" y="390" class="mono green">) -&gt; str</text>
  <text x="1244" y="416" class="mono-small green">canonical_identity_json_bytes(document) -&gt; bytes</text>
  <text x="1244" y="440" class="small muted">complete doc · sorted keys · compact · ASCII-escaped</text>

  <path d="M1380 452 V478" class="arrow-green"/>
  <g filter="url(#shadow)">
    <rect x="1220" y="478" width="320" height="128" rx="12" fill="#e8f5ec" stroke="#2b8a3e" stroke-width="1.8"/>
  </g>
  <text x="1244" y="506" class="section ink">Full Identity Hash</text>
  <text x="1244" y="534" class="mono green">identity_document_hash(</text>
  <text x="1264" y="556" class="mono green">document: IdentityDocument</text>
  <text x="1244" y="578" class="mono green">) -&gt; Sha256Digest</text>
  <text x="1244" y="599" class="small green strong">SHA-256 · 64 lowercase hex · never truncated</text>

  <!-- Strict JSON Value panel -->
  <g filter="url(#shadow)">
    <rect x="60" y="646" width="690" height="302" rx="14" class="surface"/>
  </g>
  <text x="84" y="680" class="label purple">STRICT JSON VALUE · validate_strict_json(value: Any) -&gt; Jsonable</text>
  <rect x="84" y="700" width="304" height="145" rx="10" fill="#e8f5ec" stroke="#2b8a3e"/>
  <text x="104" y="728" class="section green">Accepted exactly</text>
  <text x="104" y="756" class="mono-small ink">None | bool | int | finite float | str</text>
  <text x="104" y="779" class="mono-small ink">list[Jsonable]</text>
  <text x="104" y="802" class="mono-small ink">dict[str, Jsonable]</text>
  <text x="104" y="828" class="small muted">Recursive; shared subtrees are valid.</text>

  <rect x="410" y="700" width="316" height="145" rx="10" fill="#fdeceb" stroke="#c0392b"/>
  <text x="430" y="728" class="section red">Rejected, never converted</text>
  <text x="430" y="756" class="mono-small ink">NaN / ±Inf · non-str keys · cycles</text>
  <text x="430" y="779" class="mono-small ink">tuple · set · bytes · object · model</text>
  <text x="430" y="802" class="small muted">No implicit object or container conversion.</text>
  <text x="430" y="828" class="small red strong">{1: "x"} cannot collide with {"1": "x"}.</text>

  <rect x="84" y="865" width="642" height="58" rx="9" fill="#f8f9fc" stroke="#e3e8ef"/>
  <text x="104" y="890" class="small ink strong">Typed failure points to the first offending value or key</text>
  <text x="104" y="912" class="mono-small red">StrictJsonError.path == ("payload", "items", 2)</text>
  <text x="462" y="912" class="mono-small muted">reason · type_name · detail</text>

  <!-- Snapshot semantics -->
  <g filter="url(#shadow)">
    <rect x="778" y="646" width="376" height="302" rx="14" class="surface"/>
  </g>
  <text x="802" y="680" class="label purple">ISOLATED SNAPSHOT · NO ALIAS DRIFT</text>
  <rect x="802" y="704" width="328" height="56" rx="9" fill="#f4eefb" stroke="#6f42c1"/>
  <text x="966" y="728" text-anchor="middle" class="mono-small purple">caller payload</text>
  <text x="966" y="748" text-anchor="middle" class="small muted">validated first</text>
  <path d="M966 760 V790" class="arrow"/>
  <rect x="802" y="790" width="328" height="62" rx="9" fill="#e9f2fb" stroke="#1866b4"/>
  <text x="966" y="815" text-anchor="middle" class="mono-small blue">copy.deepcopy(payload)</text>
  <text x="966" y="837" text-anchor="middle" class="small ink strong">document owns an independent snapshot</text>
  <text x="802" y="880" class="small red strong">✕ Later input mutation cannot change the hash.</text>
  <text x="802" y="906" class="small green strong">✓ to_json_dict() returns another fresh deep copy.</text>
  <text x="802" y="930" class="small muted">Deep copies isolate inputs and exported mappings.</text>

  <!-- One-shot and prefix -->
  <g filter="url(#shadow)">
    <rect x="1182" y="646" width="358" height="135" rx="14" fill="#e9f2fb" stroke="#1866b4" stroke-width="1.5"/>
  </g>
  <text x="1206" y="677" class="label blue">ONE-SHOT, SAME PATH</text>
  <text x="1206" y="706" class="mono blue">compute_identity_hash(</text>
  <text x="1226" y="728" class="mono blue">document: dict[Any, Any]</text>
  <text x="1206" y="750" class="mono blue">) -&gt; Sha256Digest</text>
  <text x="1206" y="770" class="small muted">validate_identity_document → full hash</text>

  <path d="M1380 606 V806" class="arrow-amber"/>
  <g filter="url(#shadow)">
    <rect x="1182" y="806" width="358" height="159" rx="14" fill="#fff6e0" stroke="#9a6700" stroke-width="1.5"/>
  </g>
  <text x="1206" y="837" class="label amber">DISPLAY-ONLY PROJECTION</text>
  <text x="1206" y="866" class="mono amber">identity_hash_prefix(</text>
  <text x="1226" y="888" class="mono amber">hash_hex: Sha256Digest | str,</text>
  <text x="1226" y="910" class="mono amber">length: int</text>
  <text x="1206" y="932" class="mono amber">) -&gt; str</text>
  <text x="1206" y="954" class="small ink strong">Never identity, equality, a key, or a reference.</text>

  <!-- Prohibited paths -->
  <rect x="60" y="982" width="1480" height="70" rx="12" fill="#1b2333"/>
  <text x="84" y="1012" class="label" fill="#f4a8a0">THE IDENTITY LANE HAS NO POLICY HOOKS</text>
  <text x="84" y="1038" class="mono" fill="#ffffff">NO coercion   ·   NO Serializer.to_jsonable   ·   NO handlers   ·   NO normalization   ·   NO truncation in the hash path</text>
  <text x="1516" y="1038" text-anchor="end" class="small" fill="#c9d1dc">Validated document → exact bytes → full identity</text>

  <text x="60" y="1080" class="small muted">Source: dr_serialize.identity, canonical, _core.digests · blue = API flow · purple = invariant boundary · green = identity output · red = rejection · amber = display only</text>
</svg>
